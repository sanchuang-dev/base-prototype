name: One-time Lingnan image import

on:
  push:
    branches: ["feat/lingnan-local-images"]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install pillow==11.3.0
      - name: Download, validate and localize images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from tempfile import TemporaryDirectory
          from io import BytesIO
          import hashlib, json, re
          from PIL import Image, ImageOps

          html_file = Path("index.html")
          source_html = html_file.read_text(encoding="utf-8")
          regex = re.compile(r"https://lh3\.googleusercontent\.com/aida-public/[A-Za-z0-9_-]+")
          urls = list(dict.fromkeys(regex.findall(source_html)))
          names = ["hero-editorial", "gift-business", "gift-seasonal", "culture-banner",
                   "incense-gift", "neck-wrap", "mugwort-roll", "custom-box", "premium-box"]
          assert len(urls) == len(names) == 9, f"Expected 9 unique images; found {len(urls)}"
          target = Path("assets/images")
          provenance = []
          with TemporaryDirectory() as temporary:
              temp = Path(temporary)
              for src, name in zip(urls, names):
                  request = Request(src, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(request, timeout=45) as response:
                      binary = response.read(15 * 1024 * 1024 + 1)
                      mime = response.headers.get("Content-Type", "")
                  assert 1000 < len(binary) <= 15 * 1024 * 1024, f"Invalid size for {name}"
                  assert mime.startswith("image/"), f"Not an image: {name}: {mime}"
                  with Image.open(BytesIO(binary)) as im:
                      im.load()
                      assert im.width >= 150 and im.height >= 150, f"Too small: {name}"
                      im = ImageOps.exif_transpose(im)
                      if im.mode not in ("RGB", "RGBA"):
                          im = im.convert("RGBA" if "A" in im.getbands() else "RGB")
                      width, height = im.size
                      im.save(temp / (name + ".webp"), "WEBP", quality=86, method=6)
                  assert (temp / (name + ".webp")).stat().st_size > 1000
                  provenance.append({"file": name + ".webp", "source": src,
                                     "source_sha256": hashlib.sha256(binary).hexdigest(),
                                     "dimensions": [width, height]})
                  print(f"{name}: {width}x{height}, {(temp / (name + '.webp')).stat().st_size} bytes")
              target.mkdir(parents=True, exist_ok=True)
              for name in names:
                  (temp / (name + ".webp")).replace(target / (name + ".webp"))
          (target / "sources.json").write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          localized = source_html
          for src, name in zip(urls, names):
              localized = localized.replace(src, "./assets/images/" + name + ".webp")
          assert not regex.search(localized), "Google image reference remains"
          html_file.write_text(localized, encoding="utf-8")
          print("All 9 image sources localized")
          PY
      - name: Commit image assets to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(lingnan): bundle nine Stitch images as local WebP"
          git push origin HEAD:feat/lingnan-local-images
