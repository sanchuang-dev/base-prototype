name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild V0.3.1 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          cat release/v0.3.1/index.html.gz.b64.part.* \
            | base64 --decode \
            | gzip --decompress \
            > _site/index.html

          echo "fa171baa73d582134818884289cf7dfbfec7d4d5c48a4e47d849eeeda84a76a8  _site/index.html" \
            | sha256sum --check -

      - name: Fix homepage title for V0.3.2
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text()

          old_route = 'home:      { title: "社区家庭健康", sub: "示例街道 · 幸福里社区", tab: "home" },'
          new_route = 'home:      { title: "本地生活服务", sub: "示例街道 · 幸福里社区", tab: "home" },'

          old_title = 'document.title = cfg.title + " · 社区家庭健康服务平台";'
          new_title = 'document.title = cfg.title + " · 幸福里社区";'

          if old_route not in html:
              raise SystemExit("homepage route title source not found")
          if old_title not in html:
              raise SystemExit("document title source not found")

          html = html.replace(old_route, new_route, 1)
          html = html.replace(old_title, new_title, 1)
          path.write_text(html)
          PY

          echo "a68937451cac05d22be8e1f3ddb92b625dc9ba9318c855bd436aa5b5dad09e16  _site/index.html" \
            | sha256sum --check -

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
