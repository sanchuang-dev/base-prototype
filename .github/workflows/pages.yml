name: Publish Sanchuang demo directory to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build independent local-life demo
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_local_life.py

      - name: Render public demo directory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_portal.py

      - name: Stage independent customer demos
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assemble_demos.py

      - name: Render client proposal invitations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_invitations.py
          test -s _site/proposal/local-life/index.html
          test -s _site/proposal/lingnan/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # A successful deployment is not proof that customers can load the pages.
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test published root and customer paths
        shell: bash
        run: |
          set -euo pipefail
          base="https://sanchuang-dev.github.io/base-prototype"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --max-time 20 "$base/$path" -o "$tmp/$output"
            test -s "$tmp/$output"
            echo "HTTP OK: $base/$path"
          }

          fetch "" portal.html
          fetch "local-life/" community.html
          fetch "lingnan/" lingnan.html
          fetch "lingnan/app.css" lingnan.css
          fetch "lingnan/app.js" lingnan.js
          fetch "proposal/local-life/" proposal-local.html
          fetch "proposal/lingnan/" proposal-lingnan.html

          grep -q '三创 · 演示中心' "$tmp/portal.html"
          ! grep -q '/proposal/' "$tmp/portal.html"
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$tmp/proposal-local.html"
          grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$tmp/proposal-lingnan.html"
          grep -q 'href="../../local-life/"' "$tmp/proposal-local.html"
          grep -q 'href="../../lingnan/"' "$tmp/proposal-lingnan.html"
          grep -q '社区本地生活' "$tmp/proposal-local.html"
          grep -q '岭南红艾' "$tmp/proposal-lingnan.html"
          grep -q 'href="./local-life/"' "$tmp/portal.html"
          grep -q 'href="./lingnan/"' "$tmp/portal.html"
          grep -q '本地生活服务' "$tmp/community.html"
          grep -q '岭南红艾' "$tmp/lingnan.html"
          grep -q 'data-page="home"' "$tmp/lingnan.html"
          grep -q 'data-page="trial"' "$tmp/lingnan.html"
          grep -q './app.css' "$tmp/lingnan.html"
          grep -q './app.js' "$tmp/lingnan.html"
          echo "Published site pages and static assets confirmed"
