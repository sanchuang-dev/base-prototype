name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild V0.3 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          cat release/v0.3/index.html.gz.b64.part.* \
            | base64 --decode \
            | gzip --decompress \
            > _site/index.html

          echo "65981351a165ea7cade72427059429d398057a6f90a7ea1feae40e4925a0bf99  _site/index.html" \
            | sha256sum --check -

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
