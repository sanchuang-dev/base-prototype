name: Prototype CI
on:
  push:
    branches:
      - "feat/lingnan-red-mugwort-prototype"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "app.css"
      - "tests/**"
jobs:
  static-and-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check app.js
      - name: HTML structure and local assets
        run: |
          python3 - <<'PY'
          import pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          pages = ("home", "culture", "shop", "bespoke", "partners", "account", "trial")
          for page in pages:
              assert f'data-page="{page}"' in html, f"missing page: {page}"
              assert f'data-go="{page}"' in html, f"missing navigation: {page}"
          for asset in ("app.css", "app.js"):
              assert pathlib.Path(asset).is_file(), f"missing asset {asset}"
              assert asset in html
          print("7 routes and local asset links OK")
          PY
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run interactive smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/prototype-server.log 2>&1 &
          node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-smoke-screens
          path: |
            mobile-smoke.png
            desktop-smoke.png
          if-no-files-found: ignore
